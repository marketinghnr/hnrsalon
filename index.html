<script>

const dice = document.getElementById("dice");
const result = document.getElementById("result");
const prize = document.getElementById("prize");
const button = document.getElementById("rollButton");


const prizes = {

    1: "Gel Polish",

    2: "Manicure",

    3: "Foot Massage",

    4: "Face Massage",

    5: "Gel Polish",

    6: "Wash & Blast Dry"

};


function drawDice(service) {

    dice.innerHTML = "";

    const serviceText = document.createElement("div");

    serviceText.className = "dice-service";

    serviceText.textContent = service;

    dice.appendChild(serviceText);

}


function rollDice() {

    button.disabled = true;

    result.classList.remove("show");

    dice.classList.add("rolling");


    let counter = 0;


    const animation = setInterval(() => {

        const randomNumber =
            Math.floor(Math.random() * 6) + 1;

        drawDice(prizes[randomNumber]);

        counter++;


        if (counter >= 10) {

            clearInterval(animation);


            const finalNumber =
                Math.floor(Math.random() * 6) + 1;


            const winningService =
                prizes[finalNumber];


            drawDice(winningService);


            dice.classList.remove("rolling");


            prize.textContent =
                winningService;


            result.classList.add("show");


            button.disabled = false;

        }

    }, 120);

}


drawDice("ROLL!");

</script>
